<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Hamid Khan, GTM engineer">
  <rect width="1200" height="300" fill="#F4EEE2"/>
  <rect x="0" y="0" width="6" height="300" fill="#DE4F1D"/>

  <!-- A pipeline, which is what most of this work actually is: a source, a
       filter, a decision, an action. Low opacity so it reads as texture. -->
  <g opacity="0.5" fill="none" stroke="#DE4F1D" stroke-width="1.5">
    <line x1="885" y1="150" x2="955" y2="105"/>
    <line x1="885" y1="150" x2="955" y2="195"/>
    <line x1="955" y1="105" x2="1030" y2="150"/>
    <line x1="955" y1="195" x2="1030" y2="150"/>
    <line x1="1030" y1="150" x2="1105" y2="150"/>
  </g>
  <g fill="#F4EEE2" stroke="#DE4F1D" stroke-width="2">
    <circle cx="885" cy="150" r="9"/>
    <circle cx="955" cy="105" r="7"/>
    <circle cx="955" cy="195" r="7"/>
    <circle cx="1030" cy="150" r="9"/>
  </g>
  <circle cx="1105" cy="150" r="11" fill="#DE4F1D"/>

  <text x="72" y="118" font-family="Georgia,'Times New Roman',Times,serif" font-size="62" fill="#16120C">Hamid Khan</text>
  <rect x="74" y="140" width="54" height="3" fill="#DE4F1D"/>
  <text x="72" y="183" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#5E574B">GTM engineer. I build the tooling my own sales and recruiting runs on.</text>

  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" letter-spacing="0.08em">
    <rect x="72" y="214" width="150" height="30" rx="15" fill="none" stroke="#DE4F1D" stroke-width="1.5"/>
    <circle cx="90" cy="229" r="4" fill="#DE4F1D"/>
    <text x="102" y="234" fill="#DE4F1D">APPLYING · LIVE</text>

    <rect x="232" y="214" width="96" height="30" rx="15" fill="none" stroke="#DED5C4"/>
    <text x="252" y="234" fill="#897F71">QUILL</text>

    <rect x="338" y="214" width="108" height="30" rx="15" fill="none" stroke="#DED5C4"/>
    <text x="358" y="234" fill="#897F71">EXYNEX</text>

    <rect x="456" y="214" width="170" height="30" rx="15" fill="none" stroke="#DED5C4"/>
    <text x="476" y="234" fill="#897F71">ICP PIPELINES</text>
  </g>
</svg>
