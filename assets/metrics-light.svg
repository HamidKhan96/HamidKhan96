<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="190" viewBox="0 0 1200 190" role="img" aria-label="Four counted figures from the work">
  <rect width="1200" height="190" rx="14" fill="#FFFFFF" stroke="#DED5C4"/>
  <text x="150" y="88" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-size="46" fill="#DE4F1D">12,544</text>
  <text x="150" y="120" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#16120C">tests passing</text>
  <text x="150" y="143" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#897F71">one suite, 74 seconds</text>
  <line x1="300" y1="42" x2="300" y2="148" stroke="#DED5C4"/>
  <text x="450" y="88" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-size="46" fill="#DE4F1D">2,042</text>
  <text x="450" y="120" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#16120C">commits</text>
  <text x="450" y="143" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#897F71">since April 2026</text>
  <line x1="600" y1="42" x2="600" y2="148" stroke="#DED5C4"/>
  <text x="750" y="88" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-size="46" fill="#DE4F1D">148</text>
  <text x="750" y="120" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#16120C">migrations</text>
  <text x="750" y="143" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#897F71">forward only, no rollbacks</text>
  <line x1="900" y1="42" x2="900" y2="148" stroke="#DED5C4"/>
  <text x="1050" y="88" text-anchor="middle" font-family="Georgia,'Times New Roman',Times,serif" font-size="46" fill="#DE4F1D">11,819</text>
  <text x="1050" y="120" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#16120C">job postings</text>
  <text x="1050" y="143" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#897F71">indexed and de-duplicated</text>
  </svg>
